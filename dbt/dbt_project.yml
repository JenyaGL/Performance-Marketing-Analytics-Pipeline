name: performance_pipeline
version: "1.0.0"
config-version: 2
profile: performance_pipeline

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
snapshot-paths: ["snapshots"]
target-path: target
clean-targets: [target, dbt_packages]

vars:
  ab_control_variant: control
  ab_treatment_variant: treatment_v2
  ab_z_critical: 1.96  # two-sided, alpha = 0.05
  late_arrival_threshold_minutes: 60  # generator: normal lag 2-10s, late lag 12-48h

models:
  performance_pipeline:
    staging:
      +schema: silver
      +materialized: incremental
      +on_schema_change: append_new_columns
    marts:
      +schema: gold
      +materialized: table
